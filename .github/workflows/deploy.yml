name: Build & deploy to Oracle server

# WHEN THIS RUNS
#  1. push        — the blog agent commits a post, the site rebuilds within ~a minute
#  2. schedule    — 01:30 UTC = 07:00 IST daily, a safety-net rebuild so sitemap.xml
#                   refreshes even if a push event was missed
#  3. manual      — the "Run workflow" button
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

# Never let two deploys race each other onto the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege: this workflow only reads the repo and pushes files to the
# server over SSH — it never needs to write back to GitHub.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds every page, generates a page per blog post, then rewrites
      # dist/sitemap.xml. A post with malformed frontmatter fails HERE,
      # so a broken post never reaches the server.
      - name: Build site and sitemap
        run: npm run build

      - name: Verify sitemap was generated
        run: |
          test -s dist/sitemap.xml || { echo "::error::sitemap.xml missing or empty"; exit 1; }
          echo "URLs in sitemap: $(grep -c '<loc>' dist/sitemap.xml)"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # --delete removes files on the server that no longer exist in dist/,
      # so deleted posts actually disappear from the live site.
      - name: Deploy to Oracle server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy

# ---------------------------------------------------------------------------
# REQUIRED REPOSITORY SECRETS  (Settings → Secrets and variables → Actions)
#
#   SSH_PRIVATE_KEY  private half of a deploy keypair (the PUBLIC half goes in
#                    ~/.ssh/authorized_keys on the Oracle server)
#   SSH_HOST         server IP or hostname
#   SSH_USER         e.g. ubuntu / opc  (the default user on Oracle Cloud images)
#   DEPLOY_PATH      web root, e.g. /var/www/alsharaf
#
# Never commit any of these values to the repo.
#
# ORACLE CLOUD NOTE: open ports 80/443 in BOTH the VCN security list and the
# instance firewall (`sudo iptables -I INPUT -p tcp --dport 443 -j ACCEPT` plus
# netfilter-persistent save) — Oracle images block them by default, which is the
# usual reason a correct nginx config still appears unreachable.
# ---------------------------------------------------------------------------
