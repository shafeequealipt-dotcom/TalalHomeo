# policy.drtalalhomeo.in — the privacy policy and terms pages on their own
# subdomain (used as the policy/terms links for the clinic's Google OAuth app).
#
# It serves the SAME built files as the main site (/var/www/alsharaf, so the
# pages deploy with every push), but only /privacy and /terms plus the assets
# they need. Every other path redirects to the main domain, so the subdomain
# never becomes a second copy of the whole site.
#
# Install (needs the DNS A record for policy.drtalalhomeo.in first):
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d policy.drtalalhomeo.in
#   sudo cp deploy/nginx-policy.conf /etc/nginx/sites-available/alsharaf-policy
#   sudo ln -sf /etc/nginx/sites-available/alsharaf-policy /etc/nginx/sites-enabled/alsharaf-policy
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name policy.drtalalhomeo.in;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://policy.drtalalhomeo.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name policy.drtalalhomeo.in;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/policy.drtalalhomeo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/policy.drtalalhomeo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/alsharaf;
    autoindex off;

    limit_req zone=clinic_rl burst=40 nodelay;
    limit_req_status 429;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = / {
        return 302 /privacy;
    }

    # Trailing-slash forms → the canonical no-slash address.
    location ~ ^/(privacy|terms)/$ {
        return 301 /$1;
    }

    location ~ ^/(privacy|terms)$ {
        try_files /$1/index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/alsharaf-security-headers.conf;
    }

    # Stylesheet and images the two pages use.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/alsharaf-security-headers.conf;
        access_log off;
    }

    location ~ ^/(favicon\.png|apple-touch-icon\.png)$ {
        expires 30d;
        add_header Cache-Control "public";
        include snippets/alsharaf-security-headers.conf;
        access_log off;
    }

    # Anything else belongs to the main site.
    location / {
        return 301 https://drtalalhomeo.in$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml;
}
