# Installed into /etc/nginx/conf.d/ by setup-server.sh — must live at http
# level, which the site's own server block (nginx.conf) cannot declare itself.
# 10 req/s per IP with a burst of 40 (see `limit_req` in nginx.conf) is
# comfortable for a real visitor's page-load burst and blunts naive
# scraping/DoS attempts without punishing normal use.
limit_req_zone $binary_remote_addr zone=clinic_rl:10m rate=10r/s;
