# Everything the site serves, shared by the HTTP-only config (nginx.conf,
# used before a certificate exists) and the HTTPS config (nginx-ssl.conf).
# Installed to /etc/nginx/snippets/alsharaf-site-body.conf by setup-server.sh.

# Must match DEPLOY_PATH in the GitHub Actions secrets.
root /var/www/alsharaf;
index index.html;
autoindex off;

# Don't advertise the nginx version in headers or error pages.
server_tokens off;

# Let's Encrypt certificate checks. Served from a separate folder so the
# deploy's `rsync --delete` into /var/www/alsharaf can never remove a check
# file mid-renewal. `^~` makes this win over the dotfile block below.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}

# Never serve dotfiles (.env, .git, .htaccess, editor swap files, …) even
# if one is ever accidentally left in the build output.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Basic anti-abuse: generous enough for a real visitor loading a page's
# assets in a burst, tight enough to blunt naive scraping/DoS attempts.
# Zone is defined once, at http level, in ratelimit.conf.
limit_req zone=clinic_rl burst=40 nodelay;
limit_req_status 429;

# Canonical URLs carry no trailing slash (matching the <link rel="canonical">
# Astro emits and the sitemap), so send /about/ → /about. Root "/" has nothing
# before the slash, so it never matches.
rewrite ^/(.*)/$ /$1 permanent;

# Astro builds directory-style routes: about/index.html is served AT /about.
# Note there's no `$uri/` here: that entry makes nginx 301 /about → /about/,
# which would fight the canonical URL and the sitemap.
location / {
    try_files $uri $uri/index.html =404;
}

error_page 404 /404.html;

# Hashed asset filenames — safe to cache hard.
location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include snippets/alsharaf-security-headers.conf;
    access_log off;
}

location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
    include snippets/alsharaf-security-headers.conf;
    access_log off;
}

# HTML and the sitemap must NOT be cached long — a new blog post has to be
# visible immediately after a deploy.
location ~* \.(?:html|xml|txt)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
    include snippets/alsharaf-security-headers.conf;
}

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/javascript
           application/json image/svg+xml;

# Security headers. Repeated inside the locations above because nginx drops
# inherited add_header lines in any block that sets its own — see
# security-headers.conf.
include snippets/alsharaf-security-headers.conf;

client_max_body_size 4m;
