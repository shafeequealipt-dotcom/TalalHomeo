# HTTPS config for drtalalhomeo.in, installed by setup-server.sh once the
# Let's Encrypt certificate exists. Written here rather than letting certbot
# edit the live file, so re-running setup-server.sh never undoes it.
#
# This server hosts other sites too. Without its own 443 block,
# https://drtalalhomeo.in falls through to the first HTTPS site nginx loads
# and shows that site's content and certificate instead of this one.

# Plain HTTP: answer certificate renewals, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name drtalalhomeo.in www.drtalalhomeo.in;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://drtalalhomeo.in$request_uri;
    }
}

# www → apex over HTTPS, so the site has one canonical address.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.drtalalhomeo.in;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/drtalalhomeo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drtalalhomeo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://drtalalhomeo.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drtalalhomeo.in;

    ssl_certificate     /etc/letsencrypt/live/drtalalhomeo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drtalalhomeo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:alsharaf_ssl:10m;
    ssl_session_timeout 1d;

    include snippets/alsharaf-site-body.conf;
}
