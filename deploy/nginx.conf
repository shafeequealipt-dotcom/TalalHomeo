# nginx site config for drtalalhomeo.in on the Oracle server.
# Installed automatically by deploy/setup-server.sh — no need to copy it by hand.
# HTTPS is added afterwards by `setup-server.sh --ssl`, which lets certbot
# append the TLS block and the http→https redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name drtalalhomeo.in www.drtalalhomeo.in;

    # Must match DEPLOY_PATH in the GitHub Actions secrets.
    root /var/www/alsharaf;
    index index.html;

    # Astro builds directory-style routes: /about/index.html served at /about
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Hashed asset filenames — safe to cache hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML and the sitemap must NOT be cached long — a new blog post has to be
    # visible immediately after a deploy.
    location ~* \.(?:html|xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;
}
