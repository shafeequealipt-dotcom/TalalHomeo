# HTTP-only config for drtalalhomeo.in — used only until the HTTPS
# certificate exists. setup-server.sh switches to nginx-ssl.conf automatically
# once /etc/letsencrypt/live/drtalalhomeo.in/ is present.

server {
    listen 80;
    listen [::]:80;
    server_name drtalalhomeo.in www.drtalalhomeo.in;

    include snippets/alsharaf-site-body.conf;
}
