# Shared security headers — `include`d in the server block AND in every
# location block that sets its own add_header (Cache-Control, in this site).
#
# WHY THIS IS A SEPARATE FILE: nginx's add_header only inherits from an
# enclosing block when the current block has NO add_header of its own. Three
# location blocks in nginx.conf each set Cache-Control, which would silently
# drop every header below for exactly those responses — including the ones
# for actual page loads (.html) — if declared only once at server level.
# Repeating via `include` keeps one source of truth instead of copy-pasted
# text that can drift out of sync.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

# Browsers only honour this over HTTPS, so it's inert on the HTTP-only config.
# No includeSubDomains/preload: other subdomains may be added later and must
# not be forced onto HTTPS before they have certificates.
add_header Strict-Transport-Security "max-age=31536000" always;
